server.port=8080

# Keep Spring MVC (Servlet) as the web layer even though WebFlux is on the classpath.
# WebFlux is used only for WebClient (non-blocking HTTP) and Flux SSE return types.
spring.main.web-application-type=servlet

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# Logging
logging.level.com.bankanalyzer=INFO

# Persistence toggle (default: disabled — no DB connection attempted)
# Set to true and configure datasource below to enable PostgreSQL persistence + deduplication
persistence.enabled=false

# PostgreSQL (only used when persistence.enabled=true)
#spring.datasource.url=jdbc:postgresql://localhost:5432/bankanalyzer
#spring.datasource.username=postgres
#spring.datasource.password=postgres

# Deduplication (only active when persistence.enabled=true)
dedup.enabled=true
dedup.window-hours=24

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bankanalyzer.kafka,com.bankanalyzer.api.dto
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Rate limiting
ratelimit.enabled=true
ratelimit.capacity=20
ratelimit.refill-tokens=20
ratelimit.refill-duration=1
ratelimit.refill-unit=MINUTES
ratelimit.cache-size=10000
ratelimit.cache-expire-minutes=10
